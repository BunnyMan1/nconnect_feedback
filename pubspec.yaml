name: ndash
description: A new Flutter package project.
version: 0.0.1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.6 <4.0.0"

dependencies:
  file: ^7.0.0
  flutter:
    sdk: flutter
  http: ^1.6.0
  dio: ^5.9.2
  http_parser: ^4.1.2
  path_provider: ^2.1.5
  shared_preferences: ^2.5.5
  battery_info: ^1.1.1
  carrier_info: ^3.0.3
  device_info_plus: ^12.4.0

dev_dependencies:
  change_app_package_name: ^1.5.0
  fake_async: ^1.3.3
  flutter_lints: ^4.0.0
  flutter_test:
    sdk: flutter
  lint: ^2.8.0
  test: ^1.30.0
  transparent_image: ^2.0.1

dependency_overrides:
  # wakelock is abandoned; replaced with its official successor
  wakelock_plus: ^1.3.0
  file: ^7.0.0

flutter:
  assets:
    - packages/ndash/assets/images/pen.png

  plugin:
    platforms:
      android:
        default_package: ndash
      ios:
        default_package: ndash
      linux:
        default_package: ndash
      macos:
        default_package: ndash
      web:
        default_package: ndash

  fonts:
    - family: LexendDeca
      fonts:
        - asset: lib/assets/fonts/LexendDeca-Regular.ttf
    - family: ndash-icons
      fonts:
        - asset: lib/assets/fonts/Ndash-Icons.ttf
