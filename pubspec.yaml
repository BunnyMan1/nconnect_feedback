name: ndash
description: A new Flutter package project.

publish_to: none

version: 0.0.1

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.6 <4.0.0"

dependencies:
  battery_plus: ^7.1.1
  # TODO(KGP): carrier_info v3.0.3 is the latest version and does NOT yet support
  # Flutter's built-in Kotlin (AGP 9+ requirement). The plugin is unmaintained upstream.
  # Track: https://github.com/ConstantineL/carrier_info/issues
  # Until a KGP-compatible version is released, nconnect_staff keeps
  # android.builtInKotlin=false in gradle.properties as a documented workaround.
  carrier_info: ^3.0.3
  device_info_plus: ^13.2.0
  dio: ^5.11.0
  file: ^7.0.1
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  web: ^1.1.1

dev_dependencies:
  change_app_package_name: ^1.5.0
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  lint: ^2.8.0
  test: ^1.30.0
  transparent_image: ^2.0.1

dependency_overrides:
  wakelock_plus: ^1.7.0
  win32: ^6.0.1

flutter:
  assets:
    - packages/ndash/assets/images/pen.png

  fonts:
    - family: LexendDeca
      fonts:
        - asset: lib/assets/fonts/LexendDeca-Regular.ttf
    - family: ndash-icons
      fonts:
        - asset: lib/assets/fonts/Ndash-Icons.ttf
